name: Verify Maven and dependencies
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: mvn --batch-mode clean test
      - run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv"
          chmod +x "$RUNNER_TEMP/osv"
          "$RUNNER_TEMP/osv" scan source --recursive .
